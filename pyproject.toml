[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autoref"
version = "1.0.0"
description = "AutoRef: harness optimization for agentic multi-reference image generation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.0",
    "pillow>=10",
    "numpy>=1.26",
    "torch>=2.6",
    "diffusers>=0.40",
    "transformers>=5.14",
    "accelerate>=1.14",
    "safetensors>=0.8",
    "huggingface_hub>=1.26",
]

[tool.setuptools.packages.find]
include = ["autoref*", "harnesses*"]

[tool.setuptools.package-data]
"autoref.search" = ["seeds/*.py"]
